[project]
name = "basic-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "marimo>=0.26.0",
    "matplotlib>=3.11.2",
    "polars>=2.2.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "rapidfuzz>=3.14.6",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.24.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
